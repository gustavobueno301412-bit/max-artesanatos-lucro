<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Dashboard Financeiro 📊</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #2c3e50;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    select, button {
      padding: 8px 16px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      background-color: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #219150;
    }

    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
      margin-bottom: 25px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: #34495e;
    }

    /* Cards de Resultado Líquido */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      padding: 20px;
      border-radius: 10px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      text-align: center;
    }

    .card h3 {
      font-size: 0.85rem;
      color: #6c757d;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .val-caixa { color: #27ae60; }
    .val-despesa { color: #c0392b; }
    
    .card-positivo {
      background-color: #e8f8f0;
      border-color: #a3e4d7;
      color: #27ae60;
    }

    .card-negativo {
      background-color: #fadbd8;
      border-color: #f5b7b1;
      color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📊 Balanço Mensal</h1>
    </header>

    <div class="controls">
      <div>
        <label for="selectYear"><strong>Ano:</strong> </label>
        <select id="selectYear">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
      <button id="btnReload">🔄 Atualizar Dados</button>
    </div>

    <div id="loadingState" class="loading">Carregando dados da planilha...</div>

    <div id="dashboardContent" style="display: none;">
      <div class="chart-container">
        <canvas id="financeChart"></canvas>
      </div>

      <div class="summary-grid">
        <div class="card">
          <h3>Total Entrada (Caixa)</h3>
          <div class="value val-caixa" id="totalCaixaAnual">R$ 0,00</div>
        </div>
        <div class="card">
          <h3>Total Saída (Despesas)</h3>
          <div class="value val-despesa" id="totalDespesasAnual">R$ 0,00</div>
        </div>
        <div class="card" id="cardLiquido">
          <h3>Resultado Líquido</h3>
          <div class="value" id="resultadoLiquido">R$ 0,00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyngmDfH-H6kKhu1yshMxJzzF3p4XkYxX8sbQqAnf6c6bXX0Xa9KSRDcK0PecUR_vH-/exec";

    let chartInstance = null;
    let globalData = { caixa: [], despesas: [] };

    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
      document.getElementById('btnReload').addEventListener('click', fetchData);
      document.getElementById('selectYear').addEventListener('change', (e) => updateDashboard(e.target.value));
    });

    async function fetchData() {
      const loadingEl = document.getElementById('loadingState');
      const contentEl = document.getElementById('dashboardContent');

      loadingEl.style.display = 'block';
      contentEl.style.display = 'none';

      try {
        const response = await fetch(API_URL);
        globalData = await response.json();

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        updateDashboard(document.getElementById('selectYear').value);
      } catch (error) {
        console.error('Erro ao buscar dados:', error);
        loadingEl.textContent = 'Erro ao carregar dados. Verifique a URL da API.';
      }
    }

    function processMonthlyTotals(items, year, dateKey, valueKey) {
      const monthlyTotals = new Array(12).fill(0);

      items.forEach(item => {
        if (!item[dateKey] || item[valueKey] == null) return;

        const date = new Date(item[dateKey]);
        if (isNaN(date.getTime())) return;

        if (date.getFullYear().toString() === year.toString()) {
          const month = date.getMonth();
          monthlyTotals[month] += parseFloat(item[valueKey]) || 0;
        }
      });

      return monthlyTotals;
    }

    function formatBRL(val) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    }

    function updateDashboard(year) {
      const caixaMensal = processMonthlyTotals(globalData.caixa, year, 'data', 'valor');
      const despesasMensal = processMonthlyTotals(globalData.despesas, year, 'data', 'valor');

      // 1. Gráfico
      const monthLabels = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      const ctx = document.getElementById('financeChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: monthLabels,
          datasets: [
            {
              label: 'Caixa (Entradas)',
              data: caixaMensal,
              backgroundColor: '#2ecc71',
              borderRadius: 4
            },
            {
              label: 'Despesas (Saídas)',
              data: despesasMensal,
              backgroundColor: '#e74c3c',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => 'R$ ' + v.toLocaleString('pt-BR') }
            }
          }
        }
      });

      // 2. Cálculos dos Totais e Líquido
      const totalCaixa = caixaMensal.reduce((a, b) => a + b, 0);
      const totalDespesas = despesasMensal.reduce((a, b) => a + b, 0);
      const liquido = totalCaixa - totalDespesas;

      document.getElementById('totalCaixaAnual').textContent = formatBRL(totalCaixa);
      document.getElementById('totalDespesasAnual').textContent = formatBRL(totalDespesas);

      const elLiquido = document.getElementById('resultadoLiquido');
      const cardLiquido = document.getElementById('cardLiquido');

      elLiquido.textContent = formatBRL(liquido);

      if (liquido >= 0) {
        cardLiquido.className = 'card card-positivo';
      } else {
        cardLiquido.className = 'card card-negativo';
      }
    }
  </script>
</body>
</html>
